name: CI

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: linux-gcc
            os: ubuntu-22.04
            build-script: "./cmake-b-release.sh"
            build-dir: "build-linux-release"
            artifact-name: "build-artifacts-linux-gcc"

          - toolchain: windows-msvc-x64
            os: windows-latest
            build-script: "cmake-b-release.cmd"
            build-dir: "build-windows-x64-release"
            artifact-name: "build-artifacts-windows-x64"
            windows-arch: "x64"
            cmake-generator-platform: "x64"

          - toolchain: windows-msvc-arm64
            os: windows-11-arm
            build-script: "cmake-b-release.cmd"
            build-dir: "build-windows-arm64-release"
            artifact-name: "build-artifacts-windows-arm64"
            windows-arch: "arm64"
            cmake-generator-platform: "ARM64"

    steps:
    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-22.04'
      run: sudo apt-get update && sudo apt-get install -y build-essential cmake

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Create .env file
      run: |
        echo "BUILD_DIR_BASE=build" > .env
        cat .env

    - name: Make build script executable (Linux)
      if: matrix.os == 'ubuntu-22.04'
      run: chmod +x cmake-b-release.sh read-env-file.sh

    - name: Build and Test using build script (Linux)
      if: matrix.os == 'ubuntu-22.04'
      run: ${{ matrix.build-script }}

    - name: Build and Test using build script (Windows)
      if: startsWith(matrix.os, 'windows')
      shell: cmd
      env:
        AWW_WINDOWS_ARCH: ${{ matrix.windows-arch }}
        AWW_CMAKE_GENERATOR_PLATFORM: ${{ matrix.cmake-generator-platform }}
      run: ${{ matrix.build-script }}

    - name: Verify build output
      shell: bash
      run: |
        echo "Checking build output..."
        if [ -d "${{ matrix.build-dir }}" ]; then
          find "${{ matrix.build-dir }}" -maxdepth 2 -type d
          find "${{ matrix.build-dir }}/bin" -maxdepth 1 \( -name "*.exe" -o -name "unit_tests" \) | head -10
        else
          echo "Expected build directory ${{ matrix.build-dir }} was not created"
          exit 1
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: |
          ${{ matrix.build-dir }}/bin/
          !${{ matrix.build-dir }}/**/*.pdb
          !${{ matrix.build-dir }}/**/*.ilk
        retention-days: 7
        if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Debug downloaded artifacts
      run: |
        echo "=== All downloaded files ==="
        find . -name "build-artifacts-*" -type d
        echo "=== Windows x64 artifact contents ==="
        if [ -d "build-artifacts-windows-x64" ]; then
          find build-artifacts-windows-x64 -type f | head -20
        else
          echo "No Windows x64 artifacts directory found"
        fi
        echo "=== Windows ARM64 artifact contents ==="
        if [ -d "build-artifacts-windows-arm64" ]; then
          find build-artifacts-windows-arm64 -type f | head -20
        else
          echo "No Windows ARM64 artifacts directory found"
        fi

    - name: Generate release tag from current date
      id: get_version
      run: |
        TAG=$(date -u +"%Y.%m.%d.%H.%M")
        echo "version=$TAG" >> $GITHUB_OUTPUT
        echo "Generated tag: $TAG"

    - name: Check if tag exists
      id: check_tag
      run: |
        if git rev-parse "${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Create release archive
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        # Create source code archive using git archive (avoids file change issues)
        echo "Creating source code archive"
        git archive --format=tar.gz --prefix=awwtools/ HEAD > awwtools-${{ steps.get_version.outputs.version }}-source.tar.gz

        mkdir -p release-files

        package_windows_artifact() {
          local artifact_dir="$1"
          local build_dir="$2"
          local archive_name="$3"
          local staging_dir="release-files/$build_dir"
          local bin_dir=""

          if [ -d "$artifact_dir/$build_dir/bin" ]; then
            bin_dir="$artifact_dir/$build_dir/bin"
          elif [ -d "$artifact_dir/bin" ]; then
            bin_dir="$artifact_dir/bin"
          else
            bin_dir="$(find "$artifact_dir" -type d -name bin | head -1)"
          fi

          if [ -z "$bin_dir" ] || [ ! -d "$bin_dir" ]; then
            echo "ERROR: Expected binary directory $bin_dir was not found"
            exit 1
          fi

          mkdir -p "$staging_dir"
          cp -r "$bin_dir" "$staging_dir/"
          rm -rf "$staging_dir/bin/logs"

          echo "Creating archive $archive_name from $bin_dir"
          (
            cd "$staging_dir"
            zip -r "../../$archive_name" bin/
          )
        }

        package_windows_artifact \
          "build-artifacts-windows-x64" \
          "build-windows-x64-release" \
          "awwtools-${{ steps.get_version.outputs.version }}-windows-x64-binaries.zip"

        package_windows_artifact \
          "build-artifacts-windows-arm64" \
          "build-windows-arm64-release" \
          "awwtools-${{ steps.get_version.outputs.version }}-windows-arm64-binaries.zip"

        # Verify both archives were created
        if [ ! -f "awwtools-${{ steps.get_version.outputs.version }}-source.tar.gz" ]; then
          echo "ERROR: Source archive was not created!"
          exit 1
        fi

        if [ ! -f "awwtools-${{ steps.get_version.outputs.version }}-windows-x64-binaries.zip" ]; then
          echo "ERROR: Windows binary archive was not created!"
          exit 1
        fi

        if [ ! -f "awwtools-${{ steps.get_version.outputs.version }}-windows-arm64-binaries.zip" ]; then
          echo "ERROR: Windows ARM64 binary archive was not created!"
          exit 1
        fi

        # List created files
        ls -la awwtools-* || echo "No archives created"

    - name: Create Release
      if: steps.check_tag.outputs.exists == 'false'
      id: create_release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: AwwTools ${{ steps.get_version.outputs.version }}
        body: |
          ## AwwTools Release ${{ steps.get_version.outputs.version }}

          **Release Date:** ${{ github.event.head_commit.timestamp }}

          ### Contents:
          - 📦 **Source Code**: Complete source code archive
          - 🖥️ **Windows x64 Binaries**: Ready-to-run executables for Windows
          - 🖥️ **Windows ARM64 Binaries**: Ready-to-run executables for Windows on Snapdragon/ARM64 devices

          Build from commit: ${{ github.sha }}
        draft: false
        prerelease: false
        files: |
          awwtools-${{ steps.get_version.outputs.version }}-source.tar.gz
          awwtools-${{ steps.get_version.outputs.version }}-windows-x64-binaries.zip
          awwtools-${{ steps.get_version.outputs.version }}-windows-arm64-binaries.zip
